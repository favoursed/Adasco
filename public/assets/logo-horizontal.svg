<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="adascoGoldHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE49E" />
      <stop offset="30%" stop-color="#E5B85C" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9B7119" />
    </linearGradient>
  </defs>

  <!-- Emblem on left -->
  <g transform="translate(15, 6) scale(0.48)">
    <!-- Chimney on Right Slope -->
    <path d="M 68 38 L 68 18 L 84 18 L 84 56 Z" fill="url(#adascoGoldHoriz)" />
    
    <!-- Outer Roof Structure -->
    <path d="M 60 4 
             L 124 64 
             L 112 74 
             L 60 25 
             L 8 74 
             L -4 64 Z" 
          fill="url(#adascoGoldHoriz)" />

    <!-- House Silhouette Pillars & Walls -->
    <rect x="12" y="72" width="16" height="34" fill="url(#adascoGoldHoriz)" />
    <rect x="92" y="72" width="16" height="34" fill="url(#adascoGoldHoriz)" />
    <rect x="12" y="96" width="96" height="10" fill="url(#adascoGoldHoriz)" />

    <!-- Centered 4-Pane Window -->
    <g transform="translate(43, 60)">
      <rect x="0" y="0" width="14" height="13" rx="1.5" fill="url(#adascoGoldHoriz)" />
      <rect x="18" y="0" width="14" height="13" rx="1.5" fill="url(#adascoGoldHoriz)" />
      <rect x="0" y="17" width="14" height="13" rx="1.5" fill="url(#adascoGoldHoriz)" />
      <rect x="18" y="17" width="14" height="13" rx="1.5" fill="url(#adascoGoldHoriz)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="86" y="38" 
        fill="url(#adascoGoldHoriz)" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="28" 
        letter-spacing="2.5">ADASCO</text>

  <text x="88" y="55" 
        fill="#E2E8F0" 
        font-family="'Montserrat', sans-serif" 
        font-weight="700" 
        font-size="8.5" 
        letter-spacing="4.5">SYNERGY LIMITED</text>
</svg>